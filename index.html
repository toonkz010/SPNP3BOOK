<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบทะเบียนหนังสือ (ศปน.ภ.3)</title>
    <!-- Tailwind CSS สำหรับตกแต่ง UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 สำหรับแจ้งเตือน -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="text-gray-800">

    <!-- Navbar -->
    <nav class="bg-[#176b5b] text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold"><i class="fas fa-book-open mr-2"></i> ระบบสารบรรณ ศปน.ภ.3</h1>
            <button onclick="document.getElementById('formModal').classList.remove('hidden')" class="bg-white text-[#176b5b] px-4 py-2 rounded shadow hover:bg-gray-100 transition">
                <i class="fas fa-plus"></i> บันทึกหนังสือใหม่
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto p-4 mt-6">
        
        <!-- การ์ดสถิติ (Statistics Cards) -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500">
                <h3 class="text-gray-500 text-sm font-semibold">หนังสือทั้งหมด</h3>
                <p class="text-3xl font-bold text-gray-700" id="stat-total">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-green-500">
                <h3 class="text-gray-500 text-sm font-semibold">หนังสือรับ</h3>
                <p class="text-3xl font-bold text-gray-700" id="stat-receive">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-purple-500">
                <h3 class="text-gray-500 text-sm font-semibold">หนังสือส่ง</h3>
                <p class="text-3xl font-bold text-gray-700" id="stat-send">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-red-500">
                <h3 class="text-gray-500 text-sm font-semibold">เรื่องร้องเรียน</h3>
                <p class="text-3xl font-bold text-gray-700" id="stat-complaint">0</p>
            </div>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-lg shadow-md overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100 border-b">
                        <th class="p-4">วันที่บันทึก</th>
                        <th class="p-4">ประเภท</th>
                        <th class="p-4">เลขที่หนังสือ</th>
                        <th class="p-4">เรื่อง</th>
                        <th class="p-4">หน่วยงาน</th>
                        <th class="p-4 text-center">สถานะ</th>
                        <th class="p-4 text-center">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <tr><td colspan="7" class="p-4 text-center text-gray-500">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal สำหรับฟอร์มบันทึกข้อมูล -->
    <div id="formModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b bg-[#176b5b] text-white">
                <h2 class="text-xl font-bold">บันทึกข้อมูลใหม่</h2>
                <button onclick="document.getElementById('formModal').classList.add('hidden')" class="text-white hover:text-gray-200"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="docForm" class="p-6 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block mb-1 font-semibold">ประเภทหนังสือ <span class="text-red-500">*</span></label>
                        <select id="docType" class="w-full border rounded p-2 focus:ring-2 focus:ring-[#176b5b]" required onchange="toggleComplaintFields()">
                            <option value="">-- เลือกประเภท --</option>
                            <option value="รับ">หนังสือรับ</option>
                            <option value="ส่ง">หนังสือส่ง</option>
                            <option value="ร้องเรียน">เรื่องร้องเรียน</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-1 font-semibold">ลงวันที่ <span class="text-red-500">*</span></label>
                        <input type="date" id="docDate" class="w-full border rounded p-2 focus:ring-2 focus:ring-[#176b5b]" required>
                    </div>
                </div>

                <div id="complaintGroup" class="hidden grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="block mb-1 font-semibold">เลขคุม (เรื่องร้องเรียน) <span class="text-red-500">*</span></label>
                        <input type="text" id="controlNumber" class="w-full border rounded p-2 focus:ring-2 focus:ring-[#176b5b]" placeholder="ระบุเลขคุม">
                    </div>
                </div>

                <div>
                    <label class="block mb-1 font-semibold">เรื่อง <span class="text-red-500">*</span></label>
                    <input type="text" id="subject" class="w-full border rounded p-2 focus:ring-2 focus:ring-[#176b5b]" required>
                </div>

                <div>
                    <label class="block mb-1 font-semibold">หน่วยงาน/ภ.จว. <span class="text-red-500">*</span></label>
                    <select id="party" class="w-full border rounded p-2 focus:ring-2 focus:ring-[#176b5b]" required>
                        <option value="">-- เลือกหน่วยงาน --</option>
                        <option value="ชัยภูมิ">ชัยภูมิ</option>
                        <option value="นครราชสีมา">นครราชสีมา</option>
                        <option value="บุรีรัมย์">บุรีรัมย์</option>
                        <option value="ยโสธร">ยโสธร</option>
                        <option value="ศรีสะเกษ">ศรีสะเกษ</option>
                        <option value="สุรินทร์">สุรินทร์</option>
                        <option value="อำนาจเจริญ">อำนาจเจริญ</option>
                        <option value="อุบลราชธานี">อุบลราชธานี</option>
                        <option value="ศปน.ตร.">ศปน.ตร.</option>
                        <option value="ศปน.ภ.3">ศปน.ภ.3</option>
                    </select>
                </div>

                <div>
                    <label class="block mb-1 font-semibold">ไฟล์แนบ (PDF/JPG สูงสุด 25MB)</label>
                    <input type="file" id="fileData" class="w-full border rounded p-2" accept=".pdf,.jpg,.jpeg,.png">
                </div>

                <div>
                    <label class="block mb-1 font-semibold">หมายเหตุ</label>
                    <textarea id="note" class="w-full border rounded p-2 focus:ring-2 focus:ring-[#176b5b]" rows="2"></textarea>
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t">
                    <button type="button" onclick="document.getElementById('formModal').classList.add('hidden')" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">ยกเลิก</button>
                    <button type="submit" class="px-4 py-2 bg-[#176b5b] text-white rounded hover:bg-[#125548] flex items-center">
                        <i class="fas fa-save mr-2"></i> บันทึกข้อมูล
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- เปลี่ยน URL ตรงนี้เป็น Web App URL ของคุณ ---
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby.../exec'; 

        // จัดการแสดงฟิลด์เรื่องร้องเรียน
        function toggleComplaintFields() {
            const type = document.getElementById('docType').value;
            const complaintGroup = document.getElementById('complaintGroup');
            if (type === 'ร้องเรียน') {
                complaintGroup.classList.remove('hidden');
                document.getElementById('controlNumber').required = true;
            } else {
                complaintGroup.classList.add('hidden');
                document.getElementById('controlNumber').required = false;
            }
        }

        // แปลงไฟล์เป็น Base64
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                if(!file) resolve(null);
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // เรียกดึงข้อมูล (JSONP)
        function loadHistory() {
            const script = document.createElement('script');
            script.src = `${SCRIPT_URL}?action=getHistory&prefix=handleDataResponse`;
            document.body.appendChild(script);
        }

        // ฟังก์ชันรับข้อมูลกลับจาก JSONP
        function handleDataResponse(response) {
            if (!response || !response.success) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถดึงข้อมูลได้', 'error');
                return;
            }

            const data = response.data;
            let total = 0, receive = 0, send = 0, complaint = 0;
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = '';

            data.forEach(item => {
                total++;
                if (item.type === 'รับ') receive++;
                else if (item.type === 'ส่ง') send++;
                else if (item.type === 'ร้องเรียน') complaint++;

                const statusColor = item.status === 'ใช้งาน' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
                const fileLink = item.fileUrl ? `<a href="${item.fileUrl}" target="_blank" class="text-blue-600 hover:underline"><i class="fas fa-paperclip"></i></a>` : '-';

                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-4 text-sm">${new Date(item.createdAt).toLocaleDateString('th-TH')}</td>
                        <td class="p-4"><span class="px-2 py-1 rounded text-xs font-semibold bg-gray-200">${item.type}</span></td>
                        <td class="p-4 font-medium text-blue-800">${item.documentNumber || item.controlNumber || '-'}</td>
                        <td class="p-4 text-sm truncate max-w-xs" title="${item.subject}">${item.subject}</td>
                        <td class="p-4 text-sm">${item.party}</td>
                        <td class="p-4 text-center"><span class="px-2 py-1 rounded text-xs ${statusColor}">${item.status}</span></td>
                        <td class="p-4 text-center">${fileLink}</td>
                    </tr>
                `;
            });

            // อัปเดตสถิติ
            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-receive').innerText = receive;
            document.getElementById('stat-send').innerText = send;
            document.getElementById('stat-complaint').innerText = complaint;
        }

        // จัดการ Form Submit (ส่งแบบ POST และจำลองการรอคิว)
        document.getElementById('docForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const fileInput = document.getElementById('fileData').files[0];
                const fileBase64 = fileInput ? await getBase64(fileInput) : null;
                const fileName = fileInput ? fileInput.name : '';

                const payload = {
                    docType: document.getElementById('docType').value,
                    docDate: document.getElementById('docDate').value,
                    controlNumber: document.getElementById('controlNumber').value,
                    subject: document.getElementById('subject').value,
                    party: document.getElementById('party').value,
                    note: document.getElementById('note').value,
                    fileData: fileBase64,
                    fileName: fileName
                };

                const requestId = 'req_' + Date.now();
                const requestBody = JSON.stringify({ action: 'processForm', requestId: requestId, payload: payload });

                // ส่ง POST Request แบบ text/plain
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: requestBody,
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                // จำลองการดึงข้อมูลใหม่หลังบันทึกเสร็จ (ในระบบจริงควรตรวจสอบด้วย getResult ผ่าน JSONP)
                setTimeout(() => {
                    document.getElementById('formModal').classList.add('hidden');
                    document.getElementById('docForm').reset();
                    toggleComplaintFields();
                    loadHistory();
                    Swal.fire('สำเร็จ', 'บันทึกข้อมูลเรียบร้อยแล้ว', 'success');
                }, 4000); // หน่วงเวลาให้ Apps Script ทำงานเสร็จ

            } catch (error) {
                Swal.fire('ข้อผิดพลาด', error.message, 'error');
            }
        });

        // โหลดข้อมูลเมื่อเปิดหน้าเว็บ
        window.onload = loadHistory;
    </script>
</body>
</html>
